name: Build pylzham wheels (manual)

# One-off helper: pylzham ships no binary wheels and needs a C compiler,
# which Windows/macOS users often lack. Build wheels on CI (compilers
# present) for every supported OS/Python, then attach them to a release
# users can `pip install` directly. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wheel on ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Patch pylzham for ARM64 macOS (x86 debug-break asm)
        if: runner.os == 'macOS'
        run: |
          rm -rf /tmp/plz && mkdir -p /tmp/plz
          python -m pip download --no-deps --no-binary=:all: "pylzham==0.1.3" -d /tmp/plz
          tar xzf /tmp/plz/pylzham-*.tar.gz -C /tmp/plz
          python - <<'PY'
          from pathlib import Path
          p = next(Path("/tmp/plz").glob("pylzham-*/src/lib/lzham_platform.cpp"))
          s = p.read_text()
          old = '__asm("int $3");'
          assert old in s, "patch target not found"
          p.write_text(s.replace(old, "__builtin_trap();"))
          print("patched", p)
          PY
          python -m pip wheel --no-deps --no-build-isolation /tmp/plz/pylzham-0.1.3 -w dist-wheels

      - name: Build wheel (Windows/Linux)
        if: runner.os != 'macOS'
        run: |
          python -m pip wheel --no-deps "pylzham==0.1.3" -w dist-wheels

      - name: List wheels
        run: |
          python -c "import glob; print('\n'.join(sorted(glob.glob('dist-wheels/*'))))"

      - uses: actions/upload-artifact@v4
        with:
          name: pylzham-wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist-wheels/*.whl
          if-no-files-found: error
