name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }} binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            sep: ";"
          - os: macos-latest
            artifact: macos
            sep: ":"
          - os: ubuntu-latest
            artifact: linux
            sep: ":"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch pylzham for ARM64 macOS (x86 debug-break asm)
        if: runner.os == 'macOS'
        run: |
          rm -rf /tmp/plz && mkdir -p /tmp/plz
          python -m pip download --no-deps --no-binary=:all: "pylzham==0.1.3" -d /tmp/plz
          tar xzf /tmp/plz/pylzham-*.tar.gz -C /tmp/plz
          python - <<'PY'
          from pathlib import Path
          p = next(Path("/tmp/plz").glob("pylzham-*/src/lib/lzham_platform.cpp"))
          s = p.read_text()
          old = '__asm("int $3");'
          assert old in s, "patch target not found"
          p.write_text(s.replace(old, "__builtin_trap();"))
          print("patched", p)
          PY
          python -m pip install /tmp/plz/pylzham-0.1.3

      - name: Install Python deps + PyInstaller
        env:
          ARCHFLAGS: ${{ runner.os == 'macOS' && '-arch arm64' || '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6"

      - name: Locate wasmtime native lib
        shell: bash
        run: |
          SPEC=$(python - <<'PY'
          import os, platform, sys
          from pathlib import Path
          import wasmtime
          plat = {'linux': 'linux', 'win32': 'win32', 'darwin': 'darwin'}[sys.platform]
          mach = platform.machine()
          if mach == 'AMD64':
              mach = 'x86_64'
          if mach in ('arm64', 'ARM64'):
              mach = 'aarch64'
          lib = {'linux': '_libwasmtime.so', 'win32': '_wasmtime.dll', 'darwin': '_libwasmtime.dylib'}[sys.platform]
          src = Path(wasmtime.__file__).parent / f'{plat}-{mach}' / lib
          assert src.exists(), f'wasmtime native lib missing: {src}'
          print(f'{src}{os.pathsep}wasmtime/{plat}-{mach}')
          PY
          )
          echo "WASMTIME_SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "wasmtime lib: $SPEC"

      - name: Build GUI binary
        shell: bash
        run: |
          ICON=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ICON=(--icon "assets/app_icon.ico")
          fi
          python -m PyInstaller --noconfirm --onefile --windowed \
            "${ICON[@]}" \
            --name "AeroflyFS-Converter" \
            --collect-all wasmtime \
            --add-binary "$WASMTIME_SPEC" \
            --add-data "tmcompress.wasm${{ matrix.sep }}." \
            --add-data "assets${{ matrix.sep }}assets" \
            ttx_gui.py

      - name: Build CLI binary
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile \
            --name "AeroflyFS-Converter-CLI" \
            --collect-all wasmtime \
            --add-binary "$WASMTIME_SPEC" \
            --add-data "tmcompress.wasm${{ matrix.sep }}." \
            --add-data "assets${{ matrix.sep }}assets" \
            ttx_converter.py

      - name: Smoke-test the CLI binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN=dist/AeroflyFS-Converter-CLI.exe; else BIN=dist/AeroflyFS-Converter-CLI; fi
          "$BIN" --help >/dev/null && echo "CLI binary OK"
          "$BIN" --selftest-wasmtime && echo "wasmtime bundled OK"

      - name: Install Qt system deps (Linux headless GUI test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: Smoke-test the GUI binary (offscreen startup)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then GUI=dist/AeroflyFS-Converter.exe; else GUI=dist/AeroflyFS-Converter; fi
          "$GUI" --selftest-gui && echo "GUI binary starts OK"

      - name: Package zips
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          os.makedirs("artifacts", exist_ok=True)
          stem = "AeroflyFS-Converter-CLI-${{ matrix.artifact }}"
          shutil.make_archive(f"artifacts/{stem}", "zip", root_dir="dist")
          print("wrote artifacts/" + stem + ".zip")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AeroflyFS-Converter-CLI-${{ matrix.artifact }}
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (draft)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          generate_release_notes: true